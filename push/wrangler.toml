# خادم إشعارات وإحصائيات ومض آرك (push-wamdarc) — نشر تلقائي من GitHub عبر Cloudflare Workers Builds
# في إعدادات الخادم: Build → Root directory = push
# المتغيرات السرية (ADMIN_KEY وغيرها) تبقى في Cloudflare كما هي ولا تنكتب هنا.
name = "push-wamdarc"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "falaq"
database_id = "3cb52fee-bfc3-4ee8-a362-15f5788ec267"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# إرسال الإشعارات المجدولة لسِراج ونَبْض، وجلب أرقامهم للتقرير الأسبوعي (اتصال داخلي بين الخوادم)
[[services]]
binding = "SIRAJ"
service = "siraj-api"

[[services]]
binding = "NABD"
service = "nabd-api"

# التقرير الأسبوعي بالإيميل (Cloudflare Email Routing). الإيميل المستلم يُضاف كمتغير سري REPORT_TO في Cloudflare
[[send_email]]
name = "MAIL"
